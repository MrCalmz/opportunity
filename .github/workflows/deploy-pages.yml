name: Refresh listings & deploy website

on:
  push:
    branches:
      - main
      - static-main
    paths:
      - "opportunity.py"
      - "tests/**"
      - "site/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".env.example"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: opportunity-pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Keep the app code on its feature branch. This also lets a scheduled
      # copy of this workflow on the default branch deploy the same feature branch.
      - name: Check out website branch
        uses: actions/checkout@v6
        with:
          ref: static-main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore provider-response cache
        uses: actions/cache@v4
        with:
          path: .opportunity-cache
          key: opportunity-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            opportunity-cache-${{ runner.os }}-

      - name: Compile Python source
        run: python -m py_compile opportunity.py tests/test_opportunity.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Refresh latest job snapshot
        run: |
          mkdir -p site/data
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from opportunity import search_jobs

          # GitHub Pages is a static site, so visitors download this snapshot.
          # Limit the client-side search index and remove enormous descriptions
          # before publishing, which keeps the site practical on mobile data.
          report = search_jobs("", days=14, location=None, remote_only=False, max_results=1200)
          source_count = len(report.get("sources", []))
          if source_count and report.get("audit", {}).get("source_errors", 0) >= source_count:
              raise SystemExit("Every job source failed; refusing to publish an empty replacement snapshot.")

          fields = (
              "title", "company", "location", "job_url", "apply_url", "url",
              "published_at", "published", "created_at", "employment_type",
              "seniority", "remote_status", "work_mode", "work_arrangement",
              "salary_min", "salary_max", "salary_currency", "salary_period",
              "salary_text", "summary", "description", "tags", "source_id",
              "source_name", "source_links", "eligible_countries", "excluded_countries",
          )

          def short_text(value, limit):
              return re.sub(r"\s+", " ", str(value or "")).strip()[:limit]

          compact_results = []
          for job in report.get("results", []):
              item = {key: job[key] for key in fields if key in job and job[key] is not None}
              if "summary" in item:
                  item["summary"] = short_text(item["summary"], 400)
              if "description" in item:
                  item["description"] = short_text(item["description"], 450)
              if isinstance(item.get("tags"), list):
                  item["tags"] = [short_text(tag, 100) for tag in item["tags"][:10]]
              if isinstance(item.get("source_links"), list):
                  item["source_links"] = [
                      {key: link[key] for key in ("source", "source_name", "source_id", "url") if key in link and link[key] is not None}
                      for link in item["source_links"][:3]
                      if isinstance(link, dict)
                  ]
              compact_results.append(item)

          report["results"] = compact_results
          report["results_count"] = len(compact_results)
          report["max_results"] = 1200
          report.pop("near_matches", None)
          report["near_matches_count"] = 0

          output = Path("site/data/jobs.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          size = output.stat().st_size
          print(f"Publishing {len(compact_results)} compact listings across {source_count} configured sources ({size:,} bytes).")
          for source in report["sources"]:
              suffix = " (cache)" if source.get("cache_used") else ""
              print(f"- {source['source_name']}: {source['status']}; {source['raw_jobs_count']} raw jobs{suffix}")
          if not compact_results:
              raise SystemExit("No job listings were collected; refusing to publish an empty replacement snapshot.")
          if size > 5 * 1024 * 1024:
              raise SystemExit(f"Snapshot is too large ({size:,} bytes); refusing to publish.")
          PY

      - name: Validate snapshot and website assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("site/index.html"),
              Path("site/assets/styles.css"),
              Path("site/assets/app.js"),
              Path("site/assets/favicon.svg"),
              Path("site/data/jobs.json"),
              Path("site/robots.txt"),
              Path("site/sitemap.xml"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing site files: " + ", ".join(missing))

          report = json.loads(Path("site/data/jobs.json").read_text(encoding="utf-8"))
          if not isinstance(report.get("results"), list):
              raise SystemExit("Snapshot does not contain a results list")
          if not isinstance(report.get("sources"), list):
              raise SystemExit("Snapshot does not contain a sources list")
          if not report["results"]:
              raise SystemExit("Snapshot is empty; keeping the previous deployment")
          if Path("site/data/jobs.json").stat().st_size > 5 * 1024 * 1024:
              raise SystemExit("Snapshot exceeds the 5 MiB mobile-friendly size limit")
          if report.get("audit", {}).get("source_errors", 0) >= len(report.get("sources", [])):
              raise SystemExit("All source feeds failed; keeping the previous deployment")
          print(f"Snapshot validated: {len(report['results'])} jobs across {len(report['sources'])} feeds")

          html = Path("site/index.html").read_text(encoding="utf-8")
          js = Path("site/assets/app.js").read_text(encoding="utf-8")
          for asset in ("./assets/styles.css", "./assets/app.js", "./assets/favicon.svg"):
              if asset not in html:
                  raise SystemExit("Missing static asset reference: " + asset)
          if './data/jobs.json' not in js:
              raise SystemExit("Frontend does not request the snapshot JSON")
          for control in ('id="employment-filter"', 'id="salary-filter"', 'id="seniority-filter"', 'id="source-filter"', 'id="reset-filters"'):
              if control not in html:
                  raise SystemExit("Missing expected search control: " + control)
          for control in ('employmentFilter', 'salaryFilter', 'seniorityFilter', 'sourceFilter', 'seniorityFits', 'sourceFits', 'resetFilters', 'salary-undisclosed', 'Salary: '):
              if control not in js:
                  raise SystemExit("Missing filter or salary-label behavior: " + control)
          robots = Path("site/robots.txt").read_text(encoding="utf-8")
          sitemap = Path("site/sitemap.xml").read_text(encoding="utf-8")
          if "https://mrcalmz.github.io/opportunity/sitemap.xml" not in robots:
              raise SystemExit("robots.txt is missing the sitemap location")
          if "<loc>https://mrcalmz.github.io/opportunity/</loc>" not in sitemap:
              raise SystemExit("sitemap.xml is missing the canonical website URL")
          PY
          node --check site/assets/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4